# Monitoring stack: Prometheus, Grafana, Alertmanager and the Prometheus
# operator. To upgrade, bump targetRevision of the chart.
#
# No resources-finalizer on purpose: deleting this Application must not
# delete Prometheus/Grafana and their data volumes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 80.5.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/values/prometheus.yaml
    - repoURL: https://github.com/marcmarina/k3s-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # Required: the operator's CRDs are too large for client-side apply
      - ServerSideApply=true
