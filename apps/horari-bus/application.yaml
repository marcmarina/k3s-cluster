# Bus timetable SPA (Vue, served by nginx) from the horari-bus repo. The chart
# and its image tag (values-image.yaml) live in that repo; this only tells
# ArgoCD to deploy it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horari-bus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/marcmarina/horari-bus
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
